name: Android Debug Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout (with whisper.cpp / llama.cpp submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK 29.0.14206865
        run: |
          set -euxo pipefail
          (yes || true) | sdkmanager --install \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Install ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache
          ccache --version | head -1

      - name: Cache ccache objects
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-debug-${{ runner.os }}-${{ hashFiles('app/src/main/cpp/CMakeLists.txt', '.gitmodules') }}-${{ github.run_id }}
          restore-keys: |
            ccache-debug-${{ runner.os }}-${{ hashFiles('app/src/main/cpp/CMakeLists.txt', '.gitmodules') }}-
            ccache-debug-${{ runner.os }}-

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # assembleDebug 只编 cpu flavor 两 ABI（cpuArm64Debug + cpuX64Debug）；
      # gpuDebug 在 build.gradle.kts 里默认禁用，故此处不会触发 Vulkan shader 编译。
      - name: Build debug APK
        env:
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_NOHASHDIR: "true"
          CCACHE_SLOPPINESS: "time_macros,include_file_ctime,include_file_mtime,locale,pch_defines"
          CCACHE_MAXSIZE: "2G"
        run: |
          ccache --zero-stats
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          ccache --show-stats | grep -iE "hits|misses|cacheable" || true

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: openflow-debug-apk
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
          retention-days: 14
